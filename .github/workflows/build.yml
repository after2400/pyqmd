name: Build

# Reusable: ci.yml runs it on every PR/push, release.yml on the new tag.
# No credentials: release.yml's publish job only downloads this artifact.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to build
        required: true
        type: string
      expected-version:
        description: If set, the wheel's `pyqmd --version` must print exactly this
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    # Apple Silicon, the only platform pyqmd supports. GitHub's macOS
    # runners have no Metal access: this proves install + CLI startup,
    # never that the MLX models run (those are `just test-slow`, locally).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
      # Same reason as ci.yml's macOS test leg: the runner's preinstalled
      # Python lacks sqlite3 loadable-extension support.
      - name: Force managed Python
        run: echo "UV_PYTHON_PREFERENCE=only-managed" >> "$GITHUB_ENV"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    # The wheel is py3-none-any, so one build is installed on every
    # supported Python. release.yml's publish job needs this whole
    # workflow, so a failure on any version blocks a release.
    needs: build
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Force managed Python
        run: echo "UV_PYTHON_PREFERENCE=only-managed" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Installs the wheel with the *latest* dependencies (no uv.lock), like
      # a user's `uv tool install pyqmd-mlx` -- the one check that catches a
      # new dependency release breaking pyqmd, or dropping a Python version.
      - name: Smoke-test the wheel
        env:
          EXPECTED_VERSION: ${{ inputs.expected-version }}
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          export UV_TOOL_DIR="$RUNNER_TEMP/uv-tools" UV_TOOL_BIN_DIR="$RUNNER_TEMP/uv-bin"
          uv tool install --python "$PYTHON_VERSION" dist/*.whl
          "$UV_TOOL_BIN_DIR/pyqmd" --help > /dev/null
          version=$("$UV_TOOL_BIN_DIR/pyqmd" --version)
          echo "pyqmd --version: $version"
          if [ -n "$EXPECTED_VERSION" ] && [ "$version" != "$EXPECTED_VERSION" ]; then
            echo "::error::expected pyqmd --version $EXPECTED_VERSION, got $version"
            exit 1
          fi
