name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    needs: [lint]
    strategy:
      # Pinned, not floating: mlx ships manylinux_2_35+ wheels only, so
      # ubuntu-24.04 (glibc 2.39) is the floor -- an older ubuntu image
      # cannot even resolve uv.lock. macos-latest is ARM, covering the
      # Apple Silicon import path.
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
      # macOS only: uv's discovery prefers the runner-preinstalled
      # python-build-standalone (higher patch version wins), whose macOS
      # builds lack sqlite3 loadable extension support -- every Store()
      # construction then dies in load_sqlite_vec with AttributeError.
      # only-managed forces the astral build setup-uv just installed
      # (verified to have enable_load_extension). Ubuntu is untouched
      # (green as-is). Done as a conditional step rather than job-level
      # env so the ubuntu leg keeps default discovery byte-for-byte.
      - name: Force managed Python on macOS
        if: matrix.os == 'macos-latest'
        run: echo "UV_PYTHON_PREFERENCE=only-managed" >> "$GITHUB_ENV"
      - run: uv sync --dev
      # No data/ or models/ on a fresh checkout (both gitignored): the
      # scifact corpus (self-generatable but 33MB + slow) and the
      # self-converted expansion weights (not fetchable anywhere) are
      # absent, so requires_scifact_corpus / requires_expansion_weights
      # tests skip with a clear reason (see tests/conftest.py).
      - run: uv run pytest -m "not slow" -q

  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
