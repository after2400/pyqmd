---
# Run 'just develop' to install pre-commit and activate these hooks.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  # --- General hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-json
      - id: check-toml

  # --- Python lint/format ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format

  # --- Commit message linting (Conventional Commits) ---
  # Uses `npx --yes commitlint` directly (already available on PATH) rather than
  # a pre-commit-managed hook repo. This mirrors the system/local hook pattern
  # used for prettier below.
  # Requires @commitlint/cli and @commitlint/config-conventional installed
  # globally (npm i -g @commitlint/cli @commitlint/config-conventional) --
  # language: system means pre-commit can't manage this dependency itself.
  - repo: local
    hooks:
      - id: commitlint
        name: commitlint
        language: system
        entry: npx --yes commitlint --edit --config .commitlintrc.mjs
        stages: [commit-msg]
        pass_filenames: false
        always_run: true

  # --- Prettier, for markdown/yaml/json only ---
  # Uses whatever `prettier` is on PATH rather than a pre-commit-managed
  # mirror repo.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        entry: prettier --write --ignore-unknown
        types_or: [markdown, yaml, json]
        stages: [pre-commit]

  # --- Block direct pushes to main (client-side backstop) ---
  # Local safety net only -- bypassable with `git push --no-verify` and only
  # active for whoever has run `just develop` in their own checkout. The
  # actual enforcement point is GitHub branch protection on the upstream repo.
  - repo: local
    hooks:
      - id: block-main-push
        name: block direct pushes to main
        language: system
        entry: scripts/block-main-push.sh
        pass_filenames: false
        always_run: true
        stages: [pre-push]
