[project]
name = "pyqmd-mlx"
dynamic = ["version"]
description = "Local hybrid search (BM25 + vectors + reranking) over markdown collections, running on MLX on Apple Silicon — a Python rewrite of qmd."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# No trove classifier exists for Apple Silicon/MLX specifically -- keywords
# carry that for PyPI search. No `License ::` classifier: PEP 639 forbids
# combining one with the SPDX `license` expression above.
keywords = ["search", "markdown", "bm25", "vector-search", "rag", "mcp", "mlx", "apple-silicon"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  # Exact: pyqmd_mlx.llm.embed carries its own copy of this release's
  # gemma3_text forward pass (to fix its padding mask), so a new release
  # must be checked against it before the pin moves.
  "mlx-embeddings==0.1.0",
  "mlx-lm>=0.31.3",
  "sqlite-vec>=0.1.9",
  "typer>=0.15",
  "mcp>=2.0.0",
  "pyyaml>=6.0",
  "wcmatch>=11.0,<12.0",
  "tree-sitter>=0.26.0",
  "tree-sitter-python>=0.25.0",
  "tree-sitter-typescript>=0.23.2",
  "tree-sitter-javascript>=0.23.1",
  "tree-sitter-go>=0.23.4",
  "tree-sitter-rust>=0.24.0",
]

[project.scripts]
pyqmd = "pyqmd_mlx.cli.app:main"

[tool.hatch.version]
path = "src/pyqmd_mlx/version.py"

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.15"]

[tool.ruff]
line-length = 100
target-version = "py311"
# docs/ holds plan/spec markdown with fenced ```python blocks that are
# often deliberate partial snippets (e.g. class-method bodies shown
# without their class wrapper, to match surrounding prose) -- ruff's
# markdown-code-block formatting treats each fenced block as a
# standalone module and re-indents it accordingly, which changes what
# the snippet visually communicates, not just its whitespace. Excluding
# docs/ keeps `ruff format` scoped to real source/test code. The
# model-input fixtures are compared byte for byte with Node's capture.
extend-exclude = ["docs/", "parity/fixtures/embedding_inputs/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: loads real MLX models and downloads weights from Hugging Face",
    "parity: cross-checks pyqmd against a captured Node qmd reference (see parity/)",
    "requires_expansion_weights: needs the query-expansion model available without a download (PYQMD_EXPAND_MODEL local dir, or default Hub repo already in the HF cache; skipped otherwise)",
    "requires_scifact_corpus: needs the gitignored scifact corpus in data/ (skipped without it)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyqmd_mlx"]

[tool.semantic_release]
version_variables = ["src/pyqmd_mlx/version.py:__version__"]
tag_format = "v{version}"
allow_zero_version = true
commit_message = "chore(release): v{version} [skip ci]"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert", "doh", "review"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "chore"]

[tool.semantic_release.changelog]
mode = "init"
template_dir = ".semrel"
exclude_commit_patterns = [
  "^doh(\\([^)]*\\))?!?:",
  "^review(\\([^)]*\\))?!?:",
  "^chore\\(release\\):",
]
